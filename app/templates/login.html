{% extends "base.html" %}

{% block content %}

<section class="card login-card">
    <h2>Anmeldung</h2>

    <p>
        Melde dich mit dem Prüferkonto an, um die
        Schreibfeedback-Anwendung zu verwenden.
    </p>

    {% if error %}
        <p class="login-error" role="alert">
            {{ error }}
        </p>
    {% endif %}

    <form method="post" action="/login">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label for="username">Benutzername</label>

        <input
            id="username"
            name="username"
            type="text"
            maxlength="200"
            autocomplete="username"
            required
            autofocus
        >

        <label for="password">Passwort</label>

        <input
            id="password"
            name="password"
            type="password"
            value=""
            maxlength="512"
            autocomplete="current-password"
            required
        >

        <button type="submit">Anmelden</button>
    </form>
</section>

{% endblock %}
