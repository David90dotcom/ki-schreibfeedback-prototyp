<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ app_name }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/style.css') }}?v={{ static_asset_version }}"
    >

    <script
        src="{{ url_for('static', path='/app.js') }}?v={{ static_asset_version }}"
        defer
    ></script>
</head>

<body>
    <main class="page">
        <header class="page-header">
            <div>
                <h1>{{ app_name }}</h1>

                <p>
                    Minimaler Prototyp zur vergleichenden Analyse
                    lokaler und cloudbasierter Sprachmodelle.
                </p>
            </div>

            {% if authenticated_user %}
                <div class="session-controls">
                    <span>
                        Angemeldet als {{ authenticated_user }}
                    </span>

                    <form method="post" action="/logout">
                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token }}"
                        >

                        <button
                            class="secondary-button logout-button"
                            type="submit"
                        >
                            Abmelden
                        </button>
                    </form>
                </div>
            {% endif %}
        </header>

        {% block content %}{% endblock %}
    </main>
</body>
</html>
