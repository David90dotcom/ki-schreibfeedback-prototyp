<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ app_name }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/style.css') }}"
    >

    <script
        src="{{ url_for('static', path='/app.js') }}"
        defer
    ></script>
</head>

<body>
    <main class="page">
        <header class="page-header">
            <h1>{{ app_name }}</h1>

            <p>
                Minimaler Prototyp zur vergleichenden Analyse
                lokaler und cloudbasierter Sprachmodelle.
            </p>
        </header>

        {% block content %}{% endblock %}
    </main>
</body>
</html>
