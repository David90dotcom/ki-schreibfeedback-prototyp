name: ki-schreibfeedback

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ki-schreibfeedback-web:0.5
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      APP_MODE: production
      ANALYSIS_DATABASE_PATH: /app/data/analysis_runs.sqlite3
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - analysis_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/login", timeout=5)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  analysis_data:
