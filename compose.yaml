name: ki-schreibfeedback

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ki-schreibfeedback-web:1.0.0-rc1
    restart: unless-stopped
    env_file:
      - path: .env
    environment:
      APP_MODE: production
      ANALYSIS_DATABASE_PATH: /app/data/analysis_runs.sqlite3
      FORWARDED_ALLOW_IPS: "*"
      RUNPOD_JOB_TIMEOUT_SECONDS: "900"
      RUNPOD_IDLE_TIMEOUT_SECONDS: "5"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - analysis_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/login", timeout=5)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  analysis_data:
  caddy_data:
  caddy_config:
